syntax = "proto3";

package ledger.v1;

import "google/protobuf/timestamp.proto";

// PostingService is the host app's value-movement surface: create and read
// double-entry transactions. Every write carries a client-supplied
// idempotency key so retries never double-apply value; replays return the
// original transaction. Entries are immutable once written — there is no
// update or delete path. The pending lifecycle (create-pending, post,
// void) arrives with a later ticket; for now transactions post at
// creation.
service PostingService {
  rpc CreateTransaction(CreateTransactionRequest) returns (Transaction);
  rpc GetTransaction(GetTransactionRequest) returns (Transaction);
}

// TransactionStatus mirrors the transactions.status CHECK constraint.
enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_POSTED = 2;
  TRANSACTION_STATUS_VOIDED = 3;
}

// TransactionInputEntry is one signed entry of the requested transaction:
// value applied to one account. Amount is a signed decimal string
// ("-100.00", "42.5") in the account's asset precision.
message TransactionInputEntry {
  string account_id = 1;
  string amount = 2;
}

message CreateTransactionRequest {
  // Required: deduplicates retries. Replaying a key returns the original
  // transaction with no additional balance movement.
  string idempotency_key = 1;
  // Optional nullable provider reference (e.g. a Stripe charge ID) used
  // for webhook deduplication and reconciliation.
  optional string reference = 2;
  // At least two entries; their signed amounts must net to zero per
  // asset, no amount may be zero, and no amount may carry more
  // fractional digits than its asset's precision.
  repeated TransactionInputEntry entries = 3;
}

message GetTransactionRequest {
  string id = 1;
}

message Transaction {
  string id = 1;
  string idempotency_key = 2;
  optional string reference = 3;
  TransactionStatus status = 4;
  repeated Entry entries = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp posted_at = 7;
}

// Entry is one immutable, signed amount applied to one account as part of
// a transaction. Amount is a signed decimal string.
message Entry {
  string id = 1;
  string transaction_id = 2;
  string account_id = 3;
  string amount = 4;
  google.protobuf.Timestamp created_at = 5;
}
