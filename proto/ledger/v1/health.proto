syntax = "proto3";

package ledger.v1;

import "google/protobuf/empty.proto";

// ServingStatus mirrors the gRPC health protocol states.
enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  SERVING = 1;
  NOT_SERVING = 2;
}

message HealthCheckResponse {
  ServingStatus status = 1;
}

// HealthService exposes public (unauthenticated) probes for orchestrators.
// Liveness must answer even when dependencies are unhealthy; readiness
// reflects actual dependency state, starting with database connectivity.
service HealthService {
  rpc CheckLiveness(google.protobuf.Empty) returns (HealthCheckResponse);
  rpc CheckReadiness(google.protobuf.Empty) returns (HealthCheckResponse);
}
